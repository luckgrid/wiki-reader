# cargo-about config: third-party licence notices for binary releases (THIRD-PARTY-LICENSES).
# Regenerate with scripts/gen-third-party-licenses.sh. Keep `accepted` in step with deny.toml.
accepted = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
# Only what we ship: the three release targets.
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
]
ignore-dev-dependencies = true
ignore-build-dependencies = true
workarounds = []
