[package]
name = "wiki-reader-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Markdown to RenderedDoc for wiki-reader"
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"

[features]
default = ["media"]
# ponytail: media is a non-optional dep (DiagramPalette is needed by lite too); the feature only
# turns on its heavy `raster` half.
media = ["wiki-reader-media/raster"]

[dependencies]
mermaid-text = { workspace = true }
pulldown-cmark = { workspace = true }
unicode-width = { workspace = true }
wiki-reader-core = { workspace = true }
wiki-reader-media = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true

[lib]
path = "src/lib.rs"
