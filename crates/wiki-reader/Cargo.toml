[package]
name = "wiki-reader"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Terminal wiki reader for markdown collections"
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"

[features]
default = ["media"]
# Image / Mermaid-raster / terminal-graphics stack. `--no-default-features` is the lite build
# (ADR-0023): text placeholders and the text/source diagram tiers only.
media = ["wiki-reader-render/media", "dep:image", "dep:ratatui-image"]

[[bin]]
name = "wiki-reader"
path = "src/main.rs"

[[example]]
name = "keylog"
path = "examples/keylog.rs"

[[example]]
name = "image-protocol"
path = "examples/image_protocol.rs"
required-features = ["media"]

[[example]]
name = "mermaid-image"
path = "examples/mermaid_image.rs"
required-features = ["media"]

[dependencies]
clap = { workspace = true }
image = { workspace = true, optional = true }
ratatui = { workspace = true }
ratatui-image = { workspace = true, optional = true }
shell-words = { workspace = true }
signal-hook = { workspace = true }
rustix = { workspace = true }
syntect = { workspace = true }
unicode-width = { workspace = true }
wiki-reader-core = { workspace = true }
wiki-reader-render = { workspace = true }

[dev-dependencies]
filetime = { workspace = true }
insta = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
