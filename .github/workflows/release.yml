name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            target: ""
          - os: macos-14
            name: macos-arm64
            target: ""
          - os: macos-14
            name: macos-x86_64
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: rustup toolchain install

      - name: Add cross target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.name }}

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [[ -n "$TARGET" ]]; then
            cargo build --release --locked -p wiki-reader --target "$TARGET"
          else
            cargo build --release --locked -p wiki-reader
          fi

      - name: Package
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          MATRIX_NAME: ${{ matrix.name }}
          TARGET: ${{ matrix.target }}
        run: |
          if [[ "$REF_TYPE" == "tag" ]]; then
            ver="$REF_NAME"
          else
            ver="dry-run"
          fi
          name="wiki-reader-${ver}-${MATRIX_NAME}"
          mkdir -p "dist/${name}"
          if [[ -n "$TARGET" ]]; then
            bin="target/${TARGET}/release/wiki-reader"
          else
            bin="target/release/wiki-reader"
          fi
          cp "$bin" "dist/${name}/"
          cp LICENSE-MIT LICENSE-APACHE "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          (cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256")
          ls -la dist/

      - name: Upload workflow artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256

      - name: Attach to GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
