name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            target: ""
          - os: macos-15
            name: macos-arm64
            target: ""
          - os: macos-15-intel
            name: macos-x86_64
            target: ""

    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches crate version
        if: github.ref_type == 'tag'
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          ver=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          expected="v${ver}"
          if [[ "$REF_NAME" != "$expected" ]]; then
            echo "tag '$REF_NAME' does not match Cargo.toml version '$expected'" >&2
            exit 1
          fi

      - name: Install toolchain
        run: rustup toolchain install

      - name: Add cross target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.name }}

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [[ -n "$TARGET" ]]; then
            cargo build --release --locked -p wiki-reader-tui --target "$TARGET"
          else
            cargo build --release --locked -p wiki-reader-tui
          fi

      - name: Smoke --version
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          ver=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          if [[ -n "$TARGET" ]]; then
            bin="target/${TARGET}/release/wiki-reader"
          else
            bin="target/release/wiki-reader"
          fi
          out=$("$bin" --version)
          echo "$out"
          echo "$out" | grep -F "$ver"

      - name: Package
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          MATRIX_NAME: ${{ matrix.name }}
          TARGET: ${{ matrix.target }}
        run: |
          if [[ "$REF_TYPE" == "tag" ]]; then
            ver="$REF_NAME"
          else
            ver="dry-run"
          fi
          name="wiki-reader-${ver}-${MATRIX_NAME}"
          mkdir -p "dist/${name}"
          if [[ -n "$TARGET" ]]; then
            bin="target/${TARGET}/release/wiki-reader"
          else
            bin="target/release/wiki-reader"
          fi
          cp "$bin" "dist/${name}/"
          cp LICENSE-MIT LICENSE-APACHE NOTICE THIRD-PARTY-LICENSES "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          (cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256")
          ls -la dist/

      - name: Upload workflow artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256

      - name: Attach to GitHub Release
        if: github.event_name == 'push'
        # softprops/action-gh-release@v3.0.3 (Node 24)
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3
        with:
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          # Only suffixed tags (`-rc.1`, `-alpha.1`) are prereleases; v0.1.11 and later are normal releases.
          prerelease: ${{ contains(github.ref_name, '-') }}

  # crates.io, after all three builds pass, on a tag push only. Trusted Publishing: crates.io
  # trusts this workflow (release.yml) in the `crates-io` environment and mints a short-lived
  # token per run, which the action revokes when the job ends. No registry secret is stored.
  # One-time setup and the break-glass path: wiki/guides/releasing.md.
  publish:
    name: crates.io
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches crate version
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          ver=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          if [[ "$REF_NAME" != "v${ver}" ]]; then
            echo "tag '$REF_NAME' does not match Cargo.toml version 'v${ver}'" >&2
            exit 1
          fi

      - name: Install toolchain
        run: rustup toolchain install

      - name: Dry run
        run: cargo publish --workspace --locked --dry-run

      - name: Authenticate with crates.io
        id: auth
        # rust-lang/crates-io-auth-action@v1.0.6
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --workspace --locked
