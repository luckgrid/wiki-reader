name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      # V22: an orphaned reader must exit cleanly (not spin, not abort) on a hung-up terminal.
      - name: Orphaned reader exits (V22)
        run: |
          cargo build --locked -p wiki-reader-tui
          python3 scripts/check-orphan-exit.py target/debug/wiki-reader

      - name: Clippy (lite)
        run: cargo clippy --locked --all-targets --no-default-features -p wiki-reader-tui -p wiki-reader-render -p wiki-reader-media -- -D warnings

      - name: Test (lite)
        run: cargo test --locked --no-default-features -p wiki-reader-tui -p wiki-reader-render -p wiki-reader-media

      - name: Lite tree has no image deps (ADR-0023)
        run: |
          tree=$(cargo tree --locked --no-default-features -p wiki-reader-tui -e normal)
          if echo "$tree" | grep -E '(^|[^A-Za-z0-9_-])(image|resvg|mermaid-rs-renderer|ratatui-image) v'; then
            echo "lite build must not pull image, resvg, mermaid-rs-renderer or ratatui-image (ADR-0023)" >&2
            exit 1
          fi

      - name: Link check
        run: cargo run --locked --quiet -p wiki-reader-tools --bin link-check

      # Repo root comes from the crate manifest, not cwd (was: ok: 0 files from elsewhere).
      - name: Link check from outside checkout
        run: |
          cd "$RUNNER_TEMP" && cargo run --locked --quiet --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" -p wiki-reader-tools --bin link-check

      - name: Install rumdl
        # rvben/rumdl@v0
        uses: rvben/rumdl@9c4cc2a2ebe176de68e1788106e25af8a9bd3899
        with:
          install-only: true
          version: "0.2.78"

      - name: Markdown format
        run: rumdl fmt --check .

      - name: Markdown lint
        run: rumdl check .

      - name: ADR-0006 core has no terminal deps
        run: |
          tree=$(cargo tree -p wiki-reader-core -e normal)
          echo "$tree"
          if echo "$tree" | grep -E '(^| )(ratatui|crossterm)( |$)'; then
            echo "wiki-reader-core must not depend on ratatui or crossterm (ADR-0006)" >&2
            exit 1
          fi

  # Minimum supported Rust version: compile everything (tests and examples included) on the
  # `rust-version` toolchain, default and lite. The development toolchain is pinned separately.
  msrv:
    name: msrv (1.92)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the MSRV toolchain
        run: rustup toolchain install 1.92.0 --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      - name: Check (default features)
        run: cargo +1.92.0 check --workspace --locked --all-targets

      - name: Check (lite)
        run: cargo +1.92.0 check --locked --no-default-features -p wiki-reader-tui -p wiki-reader-render -p wiki-reader-media

  # Licences, advisories, duplicate crates and sources (deny.toml). Separate from the matrix: it
  # needs no toolchain and runs once.
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # EmbarkStudios/cargo-deny-action@v2.1.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          command: check
