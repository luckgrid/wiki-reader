[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.4.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.98.1"
authors = ["LUCKGRID"]
repository = "https://github.com/luckgrid/wiki-reader"
homepage = "https://github.com/luckgrid/wiki-reader"

[workspace.dependencies]
thiserror = "2.0.21"
ignore = "0.4.33"
tempfile = "3.27.0"
filetime = "0.2.26"
clap = { version = "4.6.7", features = ["derive"] }
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
image = { version = "0.25.6", default-features = false, features = ["png"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_norway = "0.9.42"
toml = "0.9.8"
pulldown-cmark = { version = "0.13.4", default-features = false }
percent-encoding = "2.3.2"
notify = "8.0.0"
insta = "1.48.0"
notify-debouncer-mini = "0.7.0"
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
globset = "0.4.16"
unicode-width = "0.2.0"
shell-words = "1.1.1"
mermaid-text = "0.56.1"
signal-hook = "0.3.18"
wiki-reader-core = { path = "crates/wiki-reader-core", version = "0.1.0-alpha.4.1" }
wiki-reader-render = { path = "crates/wiki-reader-render", version = "0.1.0-alpha.4.1" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
