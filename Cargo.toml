[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.98.1"

[workspace.dependencies]
thiserror = "2.0.21"
clap = { version = "4.6.7", features = ["derive"] }
ratatui = "0.30.2"
wiki-reader-core = { path = "crates/wiki-reader-core" }
wiki-reader-render = { path = "crates/wiki-reader-render" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
